[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every unknown path is served the built index so /admin
# resolves on a hard refresh instead of 404-ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change contents, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The project data is the one file the owner re-uploads; it must never be
# served stale after a redeploy.
[[headers]]
  for = "/projects.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
